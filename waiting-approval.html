<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for Approval - Mazval GPT AI</title>
    <link rel="icon" href="https://j.top4top.io/p_3903uecld0.png" type="image/png">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <img src="https://j.top4top.io/p_3903uecld0.png" alt="Mazval GPT AI" class="auth-logo">
                </div>
                <h1>Waiting for Approval</h1>
                <p>Your account is being reviewed</p>
            </div>

            <div class="waiting-content">
                <div class="waiting-icon"><i class="fas fa-clock"></i></div>
                <p class="waiting-email" id="userEmail"></p>
                <p class="waiting-message">Your account has been created but is pending admin approval. Please wait until an administrator reviews your account.</p>
                <div class="waiting-steps">
                    <div class="step completed"><i class="fas fa-check-circle"></i><span>Account Created</span></div>
                    <div class="step active"><i class="fas fa-spinner fa-spin"></i><span>Waiting for Admin</span></div>
                    <div class="step"><i class="fas fa-circle"></i><span>Access Granted</span></div>
                </div>
            </div>

            <div class="auth-footer">
                <a href="login.html" class="auth-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>

    <script>document.write('<style>body{display:none!important}</style>')</script>
    <script>
    (function() {
        var raw = localStorage.getItem('mazval_user');
        if (!raw) { window.location.replace('login.html'); return; }
        try {
            var u = JSON.parse(raw);
            if (u.status === 'approved') { window.location.replace('index.html'); return; }
            if (u.status !== 'pending') { window.location.replace('login.html'); return; }
            document.getElementById('userEmail').textContent = u.email;
        } catch(e) { window.location.replace('login.html'); }
    })();
    </script>
</body>
</html>
