<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mazval GPT AI</title>
    <link rel="icon" href="https://j.top4top.io/p_3903uecld0.png" type="image/png">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <img src="https://j.top4top.io/p_3903uecld0.png" alt="Mazval GPT AI" class="auth-logo">
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to continue to Mazval GPT AI</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" onclick="var i=this.parentElement.querySelector('input');var ic=this.querySelector('i');if(i.type==='password'){i.type='text';ic.classList.replace('fa-eye','fa-eye-slash');}else{i.type='password';ic.classList.replace('fa-eye-slash','fa-eye');}">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-btn primary">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
                <a href="admin-login.html" class="admin-link"><i class="fas fa-shield-alt"></i> Admin Login</a>
            </div>
        </div>
    </div>

    <script>
    // Simple Toast
    function showToast(msg, type) {
        var t = document.createElement('div');
        t.className = 'toast ' + (type || 'info');
        var icons = {success:'fa-check-circle',error:'fa-times-circle',warning:'fa-exclamation-circle'};
        t.innerHTML = '<i class="fas ' + (icons[type]||'fa-info-circle') + '"></i><span>' + msg + '</span>';
        document.body.appendChild(t);
        setTimeout(function(){ t.remove(); }, 4000);
    }

    // Check if already logged in
    (function() {
        var s = localStorage.getItem('mazval_user');
        if (s) {
            try {
                var u = JSON.parse(s);
                if (u.role === 'admin') { window.location.replace('admin.html'); return; }
                if (u.status === 'approved') { window.location.replace('index.html'); return; }
                if (u.status === 'pending') { window.location.replace('waiting-approval.html'); return; }
            } catch(e) {}
        }
    })();

    // Hash password
    function hashPw(p) {
        var h = 0;
        for (var i = 0; i < p.length; i++) { h = ((h << 5) - h) + p.charCodeAt(i); h = h & h; }
        return 'h' + Math.abs(h);
    }

    // Handle Login
    document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var pass = document.getElementById('password').value;

        if (!email || !pass) { showToast('Fill all fields', 'error'); return; }

        // ADMIN LOGIN
        if (email === 'admin@mazzvall.com' && pass === 'Admin@Secure123!') {
            var admin = {id:'admin_001', name:'Admin', email:email, role:'admin', status:'approved', plan:'premium'};
            localStorage.setItem('mazval_user', JSON.stringify(admin));
            showToast('Welcome Admin!', 'success');
            setTimeout(function(){ window.location.href = 'admin.html'; }, 600);
            return;
        }

        // USER LOGIN
        var users = JSON.parse(localStorage.getItem('mazval_users') || '[]');
        var user = null;
        for (var i = 0; i < users.length; i++) {
            if (users[i].email.toLowerCase() === email.toLowerCase()) { user = users[i]; break; }
        }

        if (!user || user.password !== hashPw(pass)) {
            showToast('Email or password incorrect', 'error');
            return;
        }

        if (user.status === 'pending') {
            showToast('Account pending approval', 'warning');
            setTimeout(function(){ window.location.href = 'waiting-approval.html'; }, 600);
            return;
        }

        if (user.status === 'rejected' || user.status === 'suspended') {
            showToast('Account ' + user.status, 'error');
            return;
        }

        localStorage.setItem('mazval_user', JSON.stringify(user));
        showToast('Login successful!', 'success');
        setTimeout(function(){ window.location.href = 'index.html'; }, 600);
    };
    </script>
</body>
</html>
