<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mazval GPT AI</title>
    <link rel="icon" href="https://j.top4top.io/p_3903uecld0.png" type="image/png">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <img src="https://j.top4top.io/p_3903uecld0.png" alt="Mazval GPT AI" class="auth-logo">
                </div>
                <h1>Create Account</h1>
                <p>Join Mazval GPT AI today</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="fullName" placeholder="Enter your name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Min 8 characters" required>
                        <button type="button" class="toggle-password" onclick="var i=this.parentElement.querySelector('input');var ic=this.querySelector('i');if(i.type==='password'){i.type='text';ic.classList.replace('fa-eye','fa-eye-slash');}else{i.type='password';ic.classList.replace('fa-eye-slash','fa-eye');}">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                    </div>
                </div>

                <button type="submit" class="auth-btn primary">
                    <span>Create Account</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
    function showToast(msg, type) {
        var t = document.createElement('div');
        t.className = 'toast ' + (type || 'info');
        var icons = {success:'fa-check-circle',error:'fa-times-circle',warning:'fa-exclamation-circle'};
        t.innerHTML = '<i class="fas ' + (icons[type]||'fa-info-circle') + '"></i><span>' + msg + '</span>';
        document.body.appendChild(t);
        setTimeout(function(){ t.remove(); }, 4000);
    }

    // Check if already logged in
    (function() {
        var s = localStorage.getItem('mazval_user');
        if (s) {
            try {
                var u = JSON.parse(s);
                if (u.role === 'admin') { window.location.href = 'admin.html'; return; }
                if (u.status === 'approved') { window.location.href = 'index.html'; return; }
            } catch(e) {}
        }
    })();

    document.getElementById('registerForm').onsubmit = async function(e) {
        e.preventDefault();
        var name = document.getElementById('fullName').value.trim();
        var email = document.getElementById('email').value.trim();
        var pass = document.getElementById('password').value;
        var confirm = document.getElementById('confirmPassword').value;

        if (!name || !email || !pass || !confirm) { showToast('Fill all fields', 'error'); return; }
        if (pass.length < 8) { showToast('Password min 8 characters', 'error'); return; }
        if (pass !== confirm) { showToast('Passwords do not match', 'error'); return; }
        if (email === 'admin@mazzvall.com') { showToast('This email is reserved', 'error'); return; }

        try {
            var data = await API.register(name, email, pass);
            if (data.success) {
                showToast('Registration successful! Waiting for admin approval.', 'success');
                setTimeout(function(){ window.location.href = 'waiting-approval.html'; }, 1000);
            }
        } catch (error) {
            showToast(error.error?.message || 'Registration failed', 'error');
        }
    };
    </script>
</body>
</html>
