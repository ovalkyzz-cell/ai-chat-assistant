<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Mazval GPT AI</title>
    <link rel="icon" href="https://j.top4top.io/p_3903uecld0.png" type="image/png">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container admin-theme">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <img src="https://j.top4top.io/p_3903uecld0.png" alt="Mazval GPT AI" class="auth-logo">
                </div>
                <h1>Admin Portal</h1>
                <p>Secure admin access</p>
            </div>

            <form class="auth-form" id="adminLoginForm">
                <div class="form-group">
                    <label>Access Key</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" id="adminKey" placeholder="Enter access key" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter admin email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter password" required>
                        <button type="button" class="toggle-password" onclick="var i=this.parentElement.querySelector('input');var ic=this.querySelector('i');if(i.type==='password'){i.type='text';ic.classList.replace('fa-eye','fa-eye-slash');}else{i.type='password';ic.classList.replace('fa-eye-slash','fa-eye');}">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-btn admin-btn">
                    <span>Access Dashboard</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p><a href="login.html"><i class="fas fa-arrow-left"></i> Back to User Login</a></p>
            </div>
        </div>
        <div class="footer-credit"><p>&copy; Created Mazz-Vall</p></div>
    </div>

    <script src="js/api.js"></script>
    <script>
    function showToast(msg, type) {
        var t = document.createElement('div');
        t.className = 'toast ' + (type || 'info');
        var icons = {success:'fa-check-circle',error:'fa-times-circle',warning:'fa-exclamation-circle'};
        t.innerHTML = '<i class="fas ' + (icons[type]||'fa-info-circle') + '"></i><span>' + msg + '</span>';
        document.body.appendChild(t);
        setTimeout(function(){ t.remove(); }, 4000);
    }

    // Check if already logged in as admin
    (function() {
        var s = localStorage.getItem('mazval_user');
        if (s) {
            try {
                var u = JSON.parse(s);
                if (u.role === 'admin') { window.location.href = 'admin.html'; return; }
            } catch(e) {}
        }
    })();

    document.getElementById('adminLoginForm').onsubmit = async function(e) {
        e.preventDefault();
        var key = document.getElementById('adminKey').value.trim();
        var email = document.getElementById('email').value.trim();
        var pass = document.getElementById('password').value;

        if (key !== 'ADMIN@MAZZVALL2024') {
            showToast('Invalid access key', 'error');
            return;
        }
        if (email !== 'admin@mazzvall.com') {
            showToast('Invalid email', 'error');
            return;
        }
        if (pass !== 'Admin@Secure123!') {
            showToast('Invalid password', 'error');
            return;
        }

        try {
            var data = await API.login(email, pass);
            if (data.success) {
                var user = data.data.user;
                localStorage.setItem('mazval_user', JSON.stringify(user));
                showToast('Welcome Admin!', 'success');
                setTimeout(function(){ window.location.href = 'admin.html'; }, 600);
            }
        } catch (error) {
            showToast(error.error?.message || 'Login failed', 'error');
        }
    };
    </script>
</body>
</html>
