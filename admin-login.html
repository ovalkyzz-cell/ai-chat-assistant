<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AI Chat Assistant</title>
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container admin-theme">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo admin-logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>Admin Portal</h1>
                <p>Secure access to admin dashboard</p>
            </div>

            <div class="security-notice">
                <i class="fas fa-lock"></i>
                <span>Restricted area - Authorized personnel only</span>
            </div>

            <form class="auth-form" id="adminLoginForm">
                <div class="form-group">
                    <label for="adminKey">Admin Access Key</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" id="adminKey" placeholder="Enter admin access key" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter admin email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter password" required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberDevice">
                        <span class="checkmark"></span>
                        Remember this device
                    </label>
                </div>

                <button type="submit" class="auth-btn admin-btn">
                    <span>Access Dashboard</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="admin-info">
                    <p><strong>Default Admin Credentials:</strong></p>
                    <p>Access Key: <code>ADMIN@MAZZVALL2024</code></p>
                    <p>Email: <code>admin@mazzvall.com</code></p>
                    <p>Password: <code>Admin@Secure123!</code></p>
                </div>
            </form>

            <div class="auth-footer">
                <p><a href="login.html"><i class="fas fa-arrow-left"></i> Back to User Login</a></p>
            </div>
        </div>

        <div class="footer-credit">
            <p>&copy; Created Mazz-Vall</p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
